# Claims for discussion.md (vibepaper claims sidecar, see the
# README's "Claims sidecars"). A quote must match one sentence.

[[ok]]
quote = "(offline, no reference"
reason = "'no reference sequence' describes the checker"

[[check]]
assert = "cleaning.inject_total_recovered == cleaning.inject_total_attempted"
message = "'clean_hgvs() recovers every case by construction'"

[[claim]]
quote = "neither tool altered any valid input"
assert = "lovd_comparison.cdot_false_corrections == 0 and lovd_comparison.lovd_false_corrections == 0"
message = "'neither tool altered any valid input'"

[[ok]]
quote = "Run over their"
reason = "'over' is a preposition"

[[claim]]
quote = "neither falsely corrected a valid input"
assert = "vv_mutalyzer_comparison.vv_false_corrections == 0 and vv_mutalyzer_comparison.mut_false_corrections == 0"
message = "'neither falsely corrected a valid input' (VariantValidator, Mutalyzer)"
