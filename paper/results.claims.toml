# Claims for results.md (vibepaper claims sidecar, see the
# README's "Claims sidecars"). A quote must match one sentence.

[[claim]]
quote = "UTA stores no Ensembl alignments at all"
assert = "clinvar.uta_ensembl_pct == 0"
message = "'UTA stores no Ensembl alignments at all'"

[[ok]]
quote = "resolving every c.HGVS in ClinVar's variant_summary … effectively all RefSeq"
reason = "'every c.HGVS' describes the corpus; clinvar_source_breakdown.csv has no Ensembl rows"

[[claim]]
quote = "is dominated by indel-representation differences and by paralog and copy-number transcripts"
assert = "clinvar_vcf_residual.indel_mismatch * 2 > clinvar_vcf_residual.n_incorrect and clinvar_vcf_residual.snv_diff_pos > [clinvar_vcf_residual.unaligned_between_exons, clinvar_vcf_residual.long_cdot_allele, clinvar_vcf_residual.ambiguity_code_allele, clinvar_vcf_residual.identity_or_symbolic] | max"
message = "residual 'dominated by' indels (over half of Table S4) and paralog SNVs (the next class)"

[[ok]]
quote = "map to more than one genomic locus"
reason = "describes paralog and copy-number transcripts, not a result"

[[claim]]
quote = "reproducing ClinVar's VCF coordinate for … versus … for the same locally loaded UTA"
assert = "clinvar_submitted.cdot_resolved_pct > clinvar_submitted.uta_resolved_pct"
message = "cdot X% 'versus' UTA Y% on the submitted pairs"

[[claim]]
quote = "With only the transcript-data layer swapped … versus … for UTA"
assert = "historical.cdot_resolved_pct > historical.uta_resolved_pct"
message = "historical corpus: cdot X% 'versus' UTA Y%"

[[ok]]
quote = "over many years ( … of the … distinct transcripts are cited at more than"
reason = "method wording: 'over many years', 'more than one version', 'only the transcript-data layer swapped', 'holds no GRCh38 alignment', 'no ground truth'"

[[ok]]
quote = "HGVS/s over … timed passes"
reason = "'over' is a preposition"

[[claim]]
quote = "about a quarter of local-JSON throughput"
assert = "3.6 <= benchmark.cdot_local_vs_uta_local_ratio <= 4.4"
message = "local UTA 'about a quarter of local-JSON throughput'"

[[claim]]
quote = "failed as-submitted) with … regressions"
assert = "cleaning_corpus.regressions == 0"
message = "'with zero regressions'"

[[claim]]
quote = "strings rescued, about … of those that failed as-submitted"
assert = "(cleaning_corpus.rescued / (cleaning_corpus.corpus_n * cleaning_corpus.failed_pp / 100) * 100 - cleaning_corpus.rescued_share_pct) | abs < 1"
message = "rescued 'about X% of those that failed as-submitted' (rescued / failed)"

[[ok]]
quote = "preserved every coding"
reason = "'preserved every coding coordinate' defines the preserving category"

[[ok]]
quote = "was never aligned"
reason = "'never aligned' describes the case the check handles"

[[claim]]
quote = "every one that resolves under the substitute"
assert = "version_safety_validation.n_coordinate_changes == 0"
message = "'every one that resolves under the substitute gives the same genomic coordinate'"

[[ok]]
quote = "offline, no reference sequence"
reason = "'no reference sequence' describes the checker"

[[check]]
assert = "cleaning.inject_total_recovered == cleaning.inject_total_attempted"
message = "'clean_hgvs() recovers every case by construction'"

[[claim]]
quote = "neither tool altered any valid input"
assert = "lovd_comparison.cdot_false_corrections == 0 and lovd_comparison.lovd_false_corrections == 0"
message = "'neither tool altered any valid input'"

[[ok]]
quote = "Run over their public REST"
reason = "'over' is a preposition"

[[claim]]
quote = "neither falsely corrected a valid input"
assert = "vv_mutalyzer_comparison.vv_false_corrections == 0 and vv_mutalyzer_comparison.mut_false_corrections == 0"
message = "'neither falsely corrected a valid input' (VariantValidator, Mutalyzer)"
