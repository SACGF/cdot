# Claims for results.md (vibepaper claims sidecar, see the
# README's "Claims sidecars"). A quote must match one sentence.

[[claim]]
quote = "Ensembl itself, absent from UTA entirely"
assert = "clinvar.uta_ensembl_pct == 0 and coverage.ensembl_unique_count > 0"
message = "'Ensembl itself, absent from UTA entirely'"

[[ok]]
quote = "no Ensembl pair is dropped"
reason = "'no Ensembl pair is dropped' states why FastaSeqFetcher is used"

[[claim]]
quote = "On RefSeq the two backends are at parity"
assert = "clinvar.cdot_refseq_pct == clinvar.uta_refseq_pct"
message = "'On RefSeq the two backends are at parity'"

[[claim]]
quote = "UTA stores no Ensembl alignments at all"
assert = "clinvar.uta_ensembl_pct == 0"
message = "'UTA stores no Ensembl alignments at all'"

[[ok]]
quote = "every c.HGVS in ClinVar's variant_summary through cdot alone ( … (g., c.) pairs, effectively all"
reason = "'every c.HGVS' describes the corpus; clinvar_source_breakdown.csv has no Ensembl rows"

[[check]]
assert = "clinvar_vcf_residual.indel_mismatch * 2 > clinvar_vcf_residual.n_incorrect and clinvar_vcf_residual.snv_diff_pos > clinvar_vcf_residual.unaligned_between_exons"
message = "'dominated by indel-representation differences and by paralog and copy-number transcripts ..., plus N transcripts with bases that align to neither'"

[[claim]]
quote = "not one submitted string cites an Ensembl transcript"
assert = "clinvar_submitted.ensembl_pct == 0"
message = "'not one submitted string cites an Ensembl transcript'"

[[claim]]
quote = "versions; only …"
assert = "clinvar_submitted.version_not_current_pct > 50 and clinvar_submitted.absent_cdot_pct < 1"
message = "'submitted traffic is historical' (most cite a superseded version); 'only X% of cited versions are absent'"

[[claim]]
quote = "every RefSeq and Ensembl annotation release, a version absent from its data should be one that never appeared in an official release, and the absent citations bear that out: of … submitters only"
assert = "submitter_attribution.n_submitters_with_absent * 10 < submitter_attribution.n_submitters_total"
message = "'only N submitters ever cite a version cdot lacks' (under a tenth)"

[[claim]]
quote = "… , versus …"
assert = "clinvar_submitted.cdot_resolved_pct > clinvar_submitted.uta_resolved_pct"
message = "cdot X% 'versus' UTA Y% on the submitted pairs"

[[claim]]
quote = "The RefSeq gap invisible at the current-version ceiling (both backends ...)"
assert = "clinvar.cdot_refseq_pct == clinvar.uta_refseq_pct"
message = "'The RefSeq gap invisible at the current-version ceiling (both backends ...)'"

[[claim]]
quote = "lowest on the oldest submissions ... and lower on the newest than on 2016-2020"
assert = "clinvar_submitted.era_old_uta_pct < clinvar_submitted.era_recent_uta_pct < clinvar_submitted.era_mid_uta_pct"
message = "UTA by era: 'lowest on the oldest submissions ... and lower on the newest than on 2016-2020'"

[[claim]]
quote = "dominated by historical-version effects: … cite a version absent from the data where substitution declines to act because coordinate safety cannot be verified, and … resolve through the cited version to a coordinate that differs from ClinVar's current interpretation; the remainder cite a position or base that does not exist on the cited version, notation the biocommons grammar rejects, or an accession absent entirely"
assert = "clinvar_submitted_residual.version_refused + clinvar_submitted_residual.coordinate_drift > clinvar_submitted_residual.n_residual / 2"
message = "'The residual ... is dominated by historical-version effects'"

[[claim]]
quote = "With only the"
assert = "historical.cdot_resolved_pct > historical.uta_resolved_pct"
message = "historical corpus: cdot X% 'versus' UTA Y%"

[[ok]]
quote = ["over many years ( … of the … distinct transcripts are cited at more than", "UTA holds no GRCh38 alignment and"]
reason = "method wording: 'over many years', 'more than one version', 'only the transcript-data layer swapped', 'holds no GRCh38 alignment', 'no ground truth'"

[[ok]]
quote = "HGVS/s over …"
reason = "'over' is a preposition"

[[claim]]
quote = "about a quarter of local-JSON throughput"
assert = "3.6 <= benchmark.cdot_local_vs_uta_local_ratio <= 4.4"
message = "local UTA 'about a quarter of local-JSON throughput'"

[[check]]
assert = "cleaning_corpus.regressions == 0"
message = "'with zero regressions'"

[[claim]]
quote = "under a fixed decision-tree taxonomy (Supplementary Table S6), well over half is incomplete or reference-less input that no string-level repair can invent, about"
assert = "cleaning_corpus.residual_incomplete_pct > 55 and 20 < cleaning_corpus.residual_fixable_pct < 30 and (cleaning_corpus.residual_incomplete_pct + cleaning_corpus.residual_fixable_pct + cleaning_corpus.residual_grammar_gap_pct - 100) | abs < 0.5"
message = "Table S6 residual: 'well over half' incomplete, 'about a quarter' fixable, 'the remaining' grammar gap"

[[ok]]
quote = "preserved every coding"
reason = "'preserved every coding coordinate' defines the preserving category"

[[claim]]
quote = "the most dangerous"
assert = "version_stability.refseq_full_drift_pct > 2 * version_stability.refseq_partial_drift_pct and version_stability.ensembl_full_drift_pct > 2 * version_stability.ensembl_partial_drift_pct"
message = "'When a coordinate does move it is usually the whole CDS'"

[[claim]]
quote = "Within that tail the risk is positional: a partial drift keeps a 5' prefix intact up to its first alignment change and moves what lies downstream, so preservation falls"
assert = "positional_drift.refseq_partial_decile1_pct > positional_drift.refseq_partial_decile10_pct and positional_drift.ensembl_partial_decile1_pct > positional_drift.ensembl_partial_decile10_pct"
message = "'preservation falls from the 5'-most decile to the 3'-most'"

[[claim]]
quote = "concentrated: only …"
assert = "version_stability.refseq_accessions_drift_pct < 10"
message = "'only X% of RefSeq accessions ever drift ... a short, identifiable list'"

[[ok]]
quote = "was never aligned"
reason = "'never aligned' describes the case the check handles"

[[claim]]
quote = "every one that resolves under"
assert = "version_safety_validation.n_coordinate_changes == 0"
message = "'every one that resolves under the substitute gives the same genomic coordinate'"
