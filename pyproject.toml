[build-system]
requires = [
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "cdot"
dynamic = ["version"]
authors = [
    {name = "Dave Lawrence", email = "davmlaw@gmail.com"}
]
description = "Transcripts for HGVS libraries"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "intervaltree",
    "more_itertools",
    "bioutils>=0.5.8",
    "lazy",
    "hgvs",
    "msgspec",
]

[project.optional-dependencies]
# Local genome FASTA sequence fetching (GenomeFastaSeqFetcher / FastaSeqFetcher) - needs pysam
fasta = [
    "pysam",
]
build = [
    "HTSeq>=2.1.2",
    "ijson",
    "biopython",
    "pyhgvs",
]
test = [
    "pytest",
    "msgspec",
    "pysam",
]
# Build the manuscript and regenerate its reproducible facts
# (paper/Snakefile + paper/scripts/*.py). Not needed to use cdot as a library.
# weasyprint provides the optional PDF toolchain (vibepaper --pdf / the `pdf` rule).
paper = [
    "snakemake",
    "vibepaper>=0.9",
    "weasyprint",
]

[project.urls]
Homepage = "https://github.com/SACGF/cdot"
"Bug Tracker" = "https://github.com/SACGF/cdot/issues"

[tool.setuptools.dynamic]
version = {attr = "cdot.__version__"}

[tool.setuptools.packages.find]
# Only ship the cdot package. An allowlist avoids accidentally pulling in
# non-package directories (paper/, docs/, output/, etc) as namespace packages.
include = ["cdot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: print the reason for every skipped test in the summary
addopts = "-rs"

[tool.ruff]
# paper/ holds one-off analysis scripts for the manuscript, not shipped or tested
extend-exclude = ["paper"]

[tool.ruff.lint]
# Lint only (no formatting): pyflakes (unused imports, undefined names, unused
# variables), pycodestyle statement rules (E7) and syntax/IO errors (E9)
select = ["F", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their submodules' public names
"__init__.py" = ["F401", "F403"]
# One f-string without placeholders; fixing it is deferred so this PR doesn't conflict with open PRs on the file
"generate_transcript_data/cdot_json.py" = ["F541"]
