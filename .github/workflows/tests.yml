name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      # Lint only (no reformat). Rules and paths are configured under [tool.ruff] in pyproject.toml
      - name: Run ruff
        run: ruff check .

  # Paper wording checks against the committed facts (no render, so no pandoc):
  # claim words beside facts are checked, and every {% assert %} holds.
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Same pin as the 'paper' extra in pyproject.toml. Switch to a PyPI release
      # (vibepaper>=0.13) once one is out.
      - name: Install vibepaper
        run: python -m pip install "vibepaper @ git+https://github.com/SACGF/vibepaper@363eb8a"

      - name: Lint paper wording
        run: vibepaper lint --config paper/paper.toml --facts-dir paper/empirical_results --numbers --unused --check

      - name: Check paper asserts
        run: vibepaper check --config paper/paper.toml --facts-dir paper/empirical_results --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the built package
        run: twine check --strict dist/*

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 'test' extra: pytest/msgspec/pysam, 'build' extra: HTSeq/ijson/biopython/pyhgvs
          # (the GFF/GFF parser and pyhgvs tests need the build extra)
          pip install -e ".[test,build]"

      - name: Run tests
        run: python -m pytest tests/ -v
